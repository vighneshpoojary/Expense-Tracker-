<!DOCTYPE html>
<html>

<head>
    <title>View Expenses</title>
</head>

<body>

    <h2>View Expenses</h2>

    <table border="1">

        <tr>
            <th>Expense ID</th>
            <th>Date</th>
            <th>Category</th>
            <th>Description</th>
            <th>Amount</th>
        </tr>

        {% for expense in expenses %}

        <tr>

            <td>{{ expense.expense_id }}</td>

            <td>{{ expense.expense_date }}</td>

            <td>{{ expense.category }}</td>

            <td>{{ expense.description }}</td>

            <td>{{ expense.amount }}</td>

        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/">Home</a>

</body>

</html>
